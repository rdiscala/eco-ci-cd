---
# Reorder UEFI boot order on a single BMC via iLO Redfish API.
#
# Moves iLO Virtual CD-ROM to the top and stale OS entries to the bottom,
# so Ironic's virtual media boot override has a correct fallback order.
#
# Required variables:
#   bmc_ip (loop var from caller)
#   bmc_user, bmc_password

- name: "{{ bmc_ip }} | Get current boot order"
  ansible.builtin.uri:
    url: "https://{{ bmc_ip }}/redfish/v1/Systems/1"
    method: GET
    user: "{{ bmc_user }}"
    password: "{{ bmc_password }}"
    force_basic_auth: true
    validate_certs: false
    timeout: 30
    status_code: [200]
  register: _bmc_system
  until: _bmc_system is succeeded
  retries: 5
  delay: 5
  no_log: "{{ ansible_verbosity < 3 }}"

- name: "{{ bmc_ip }} | Store current boot order"
  ansible.builtin.set_fact:
    _bmc_current_boot_order: "{{ _bmc_system.json.Boot.BootOrder }}"

- name: "{{ bmc_ip }} | Get boot options collection"
  ansible.builtin.uri:
    url: "https://{{ bmc_ip }}/redfish/v1/Systems/1/BootOptions/"
    method: GET
    user: "{{ bmc_user }}"
    password: "{{ bmc_password }}"
    force_basic_auth: true
    validate_certs: false
    timeout: 30
    status_code: [200]
  register: _bmc_boot_options_collection
  until: _bmc_boot_options_collection is succeeded
  retries: 5
  delay: 5
  no_log: "{{ ansible_verbosity < 3 }}"

# iLO5 Redfish intermittently returns a transient 500/503 (or drops the TLS
# connection) on a per-boot-option GET, especially while the host is POSTing and
# re-enumerating boot entries. Without a per-item retry, one blip fails the whole
# loop. Retry each item so a transient error self-heals. This task is a read-only
# GET (changed=false), so retrying is safe/idempotent.
- name: "{{ bmc_ip }} | Get details for each boot option"
  ansible.builtin.uri:
    url: "https://{{ bmc_ip }}{{ item['@odata.id'] }}"
    method: GET
    user: "{{ bmc_user }}"
    password: "{{ bmc_password }}"
    force_basic_auth: true
    validate_certs: false
    timeout: 30
    status_code: [200]
  loop: "{{ _bmc_boot_options_collection.json.Members }}"
  loop_control:
    label: "{{ item['@odata.id'] | basename }}"
  register: _bmc_boot_option_details
  until: _bmc_boot_option_details is succeeded
  retries: 5
  delay: 5
  no_log: "{{ ansible_verbosity < 3 }}"

- name: "{{ bmc_ip }} | Display current boot options"
  ansible.builtin.debug:
    msg: "{{ item.json.BootOptionReference }} : {{ item.json.DisplayName }}"
  loop: "{{ _bmc_boot_option_details.results }}"
  loop_control:
    label: "{{ item.json.BootOptionReference }}"

- name: "{{ bmc_ip }} | Classify boot entries"
  ansible.builtin.set_fact:
    _bmc_virtual_media_refs: >-
      {{ _bmc_boot_option_details.results
         | map(attribute='json')
         | selectattr('DisplayName', 'search', '(?i)iLO Virtual')
         | map(attribute='BootOptionReference')
         | list }}
    _bmc_stale_os_refs: >-
      {{ _bmc_boot_option_details.results
         | map(attribute='json')
         | selectattr('DisplayName', 'search', '(?i)Red Hat|CentOS')
         | map(attribute='BootOptionReference')
         | list }}

- name: "{{ bmc_ip }} | Display classified entries"
  ansible.builtin.debug:
    msg:
      virtual_media: "{{ _bmc_virtual_media_refs }}"
      stale_os: "{{ _bmc_stale_os_refs }}"

- name: "{{ bmc_ip }} | Compute new boot order"
  ansible.builtin.set_fact:
    _bmc_new_boot_order: >-
      {{ _bmc_virtual_media_refs
         + (_bmc_current_boot_order | difference(_bmc_virtual_media_refs) | difference(_bmc_stale_os_refs))
         + _bmc_stale_os_refs }}

- name: "{{ bmc_ip }} | Patch boot order (virtual media first, stale OS last)"
  ansible.builtin.uri:
    url: "https://{{ bmc_ip }}/redfish/v1/Systems/1"
    method: PATCH
    user: "{{ bmc_user }}"
    password: "{{ bmc_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      Boot:
        BootOrder: "{{ _bmc_new_boot_order }}"
    timeout: 30
    status_code: [200, 204]
  register: _bmc_boot_order_patch
  until: _bmc_boot_order_patch is succeeded
  retries: 5
  delay: 5
  when: _bmc_new_boot_order != _bmc_current_boot_order
  no_log: "{{ ansible_verbosity < 3 }}"

- name: "{{ bmc_ip }} | Boot order updated"
  ansible.builtin.debug:
    msg: "Boot order reordered: {{ _bmc_new_boot_order }}"
  when: _bmc_new_boot_order != _bmc_current_boot_order

- name: "{{ bmc_ip }} | Boot order already correct"
  ansible.builtin.debug:
    msg: "Boot order already has virtual media first — no change needed"
  when: _bmc_new_boot_order == _bmc_current_boot_order
