---
# Mirror MCE, RHACM, and operator catalog images required by the spoke cluster
# to the disconnected registry.
#
# Two mirroring methods are used:
#
#   oc-mirror v2 (operator catalog content):
#     Declaratively mirrors catalog index images, operator bundle images, and
#     their relatedImages to the disconnected registry under the operators/
#     prefix. Automatically generates IDMS and CatalogSource resources.
#
#   skopeo (MCE/RHACM images):
#     Mirrors dynamically discovered MCE/RHACM images from hub deployments to
#     direct paths (no operators/ prefix) matching the spoke's IDMS.
#
# Prerequisites:
#   - Valid kubeconfig for hub cluster authentication
#   - oc, oc-mirror (v2), and skopeo CLI tools installed
#   - Access to registry.redhat.io (authenticated via hub pull secret)
#   - Disconnected registry reachable at {{ mirror_registry }}
#
# Usage:
#   ansible-playbook playbooks/ran/mirror-mce-images.yml \
#     -i inventories/ocp-deployment/build-inventory.py \
#     --extra-vars "kubeconfig=/path/to/hub/kubeconfig"
#
# Required variables:
#   kubeconfig: path to the hub cluster kubeconfig

- name: Mirror MCE/RHACM and operator images for spoke Day 0
  hosts: bastion
  gather_facts: false
  vars:
    mirror_registry: "{{ disconnected_registry_url | default('disconnected.registry.local') }}:{{ disconnected_registry_port | default('5000') }}"
    pull_secret_path: "/tmp/mirror-day0-pull-secret.json"
    operator_mirror_prefix: "operators"
    source_registry_rht: "registry.redhat.io"
    ocp_version: "4.19"
    imageset_config_path: "/tmp/mirror-day0-imageset-config.yaml"
    oc_mirror_workspace: "/tmp/mirror-day0-workspace"

    # Operator packages to mirror from production catalogs.
    # oc-mirror discovers all bundle images and relatedImages automatically.
    # Packages served by custom/art catalog sources (ptp-operator,
    # sriov-network-operator) are excluded — their content is already
    # included in the custom index images.
    spoke_operator_packages:
      - name: local-storage-operator
        catalog: redhat-operators
        channel: stable
      - name: cluster-logging
        catalog: redhat-operators
        channel: stable-6.4
      - name: sriov-fec
        catalog: certified-operators
        channel: stable

    # Map catalog short names to index image references
    catalog_index_map:
      redhat-operators: "{{ source_registry_rht }}/redhat/redhat-operator-index:v{{ ocp_version }}"
      certified-operators: "{{ source_registry_rht }}/redhat/certified-operator-index:v{{ ocp_version }}"

  tasks:

    - name: Assert that required variables are provided
      ansible.builtin.assert:
        that:
          - kubeconfig | default('') | length > 0
        fail_msg: "kubeconfig must be provided"

    - name: Mirror spoke Day 0 images
      block:

        # ---- Extract pull secret ----

        - name: Get hub cluster pull secret
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            name: pull-secret
            namespace: openshift-config
            kubeconfig: "{{ kubeconfig }}"
          register: hub_pull_secret
          no_log: true

        - name: Fail if pull secret not found
          ansible.builtin.fail:
            msg: "Pull secret not found in openshift-config namespace"
          when: hub_pull_secret.resources | length == 0

        - name: Write pull secret to temporary file
          ansible.builtin.copy:
            content: "{{ hub_pull_secret.resources[0].data['.dockerconfigjson'] | b64decode }}"
            dest: "{{ pull_secret_path }}"
            mode: '0600'
          no_log: true

        # ---- Discover MCE/RHACM images ----

        - name: Get assisted-service ConfigMap
          kubernetes.core.k8s_info:
            api_version: v1
            kind: ConfigMap
            name: assisted-service
            namespace: multicluster-engine
            kubeconfig: "{{ kubeconfig }}"
          register: assisted_service_cm

        - name: Extract assisted-service image references
          vars:
            cm_data: "{{ assisted_service_cm.resources[0].data | default({}) }}"
          ansible.builtin.set_fact:
            assisted_images: >-
              {{
                [
                  cm_data['AGENT_DOCKER_IMAGE']   | default(''),
                  cm_data['INSTALLER_IMAGE']      | default(''),
                  cm_data['CONTROLLER_IMAGE']     | default('')
                ] | select('match', '.+') | list
              }}
          when: assisted_service_cm.resources | length > 0

        - name: Default assisted_images to empty list if ConfigMap not found
          ansible.builtin.set_fact:
            assisted_images: []
          when: assisted_service_cm.resources | length == 0

        - name: Get deployments in klusterlet and addon namespaces
          kubernetes.core.k8s_info:
            api_version: apps/v1
            kind: Deployment
            namespace: "{{ item }}"
            kubeconfig: "{{ kubeconfig }}"
          loop:
            - open-cluster-management-agent
            - open-cluster-management-agent-addon
          register: ocm_deployments

        - name: Collect container images from klusterlet and addon deployments
          ansible.builtin.set_fact:
            ocm_images: >-
              {{
                ocm_deployments.results
                | map(attribute='resources') | flatten
                | map(attribute='spec.template.spec')
                | sum(attribute='containers', start=[])
                | map(attribute='image') | list
                +
                ocm_deployments.results
                | map(attribute='resources') | flatten
                | map(attribute='spec.template.spec')
                | selectattr('initContainers', 'defined')
                | sum(attribute='initContainers', start=[])
                | map(attribute='image') | list
              }}

        - name: Build filtered MCE/RHACM image list
          ansible.builtin.set_fact:
            mce_rhacm_images: >-
              {{
                (assisted_images + ocm_images)
                | select('match', '^registry\.redhat\.io/(multicluster-engine|rhacm2)/')
                | unique | sort | list
              }}

        - name: Display MCE/RHACM images to mirror
          ansible.builtin.debug:
            msg: "Found {{ mce_rhacm_images | length }} MCE/RHACM images to mirror (direct path)"

        # ---- Build ImageSetConfiguration for oc-mirror ----

        - name: Build Red Hat operator packages
          ansible.builtin.set_fact:
            pkgs_redhat: "{{ (pkgs_redhat | default([])) + [make_pkg] }}"
          vars:
            make_pkg: >-
              {{ {'name': item.name, 'channels': [{'name': item.channel}]} }}
          loop: "{{ spoke_operator_packages | selectattr('catalog', 'equalto', 'redhat-operators') | list }}"
          loop_control:
            loop_var: item
            label: "{{ item.name }}"

        - name: Build certified operator packages
          ansible.builtin.set_fact:
            pkgs_certified: "{{ (pkgs_certified | default([])) + [make_pkg] }}"
          vars:
            make_pkg: >-
              {{ {'name': item.name, 'channels': [{'name': item.channel}]} }}
          loop: "{{ spoke_operator_packages | selectattr('catalog', 'equalto', 'certified-operators') | list }}"
          loop_control:
            loop_var: item
            label: "{{ item.name }}"

        - name: Assemble operators for ImageSetConfiguration
          ansible.builtin.set_fact:
            mirror_operators: >-
              {{
                ([] if (pkgs_redhat | default([])) | length == 0 else
                  [{'catalog': catalog_index_map['redhat-operators'], 'packages': pkgs_redhat}])
                +
                ([] if (pkgs_certified | default([])) | length == 0 else
                  [{'catalog': catalog_index_map['certified-operators'], 'packages': pkgs_certified}])
              }}

        - name: Build ImageSetConfiguration
          ansible.builtin.set_fact:
            image_set_config:
              apiVersion: mirror.openshift.io/v1alpha2
              kind: ImageSetConfiguration
              mirror:
                operators: "{{ mirror_operators }}"

        - name: Show ImageSetConfiguration
          ansible.builtin.debug:
            var: image_set_config

        - name: Write ImageSetConfiguration to file
          ansible.builtin.copy:
            content: "{{ image_set_config | to_nice_yaml }}"
            dest: "{{ imageset_config_path }}"
            mode: '0644'

        # ---- Run oc-mirror v2 ----

        - name: Remove previous oc-mirror workspace
          ansible.builtin.file:
            path: "{{ oc_mirror_workspace }}"
            state: absent

        - name: Run oc-mirror to mirror operator content to disconnected registry
          ansible.builtin.shell: >-
            env -u REGISTRY_AUTH_FILE oc-mirror
            --authfile "{{ pull_secret_path }}"
            -c "{{ imageset_config_path }}"
            --workspace file://{{ oc_mirror_workspace }}
            docker://{{ mirror_registry }}/{{ operator_mirror_prefix }}
            --dest-tls-verify=false
            --ignore-release-signature
            --v2
          register: oc_mirror_result
          changed_when: true
          retries: 3
          delay: 30
          until: oc_mirror_result.rc == 0

        - name: Show oc-mirror output
          ansible.builtin.debug:
            var: oc_mirror_result.stdout_lines

        # ---- Apply generated manifests to hub ----

        - name: Find generated CatalogSource and IDMS manifests
          ansible.builtin.find:
            paths: "{{ oc_mirror_workspace }}/working-dir/cluster-resources/"
            patterns:
              - "cs*.yaml"
              - "idms*.yaml"
            file_type: file
          register: oc_mirror_manifests

        - name: Display generated manifests
          ansible.builtin.debug:
            msg: "Found {{ oc_mirror_manifests.files | length }} manifests: {{ oc_mirror_manifests.files | map(attribute='path') | list }}"

        - name: Apply generated manifests to hub cluster
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig }}"
            state: present
            src: "{{ item.path }}"
          loop: "{{ oc_mirror_manifests.files }}"
          loop_control:
            label: "{{ item.path | basename }}"

        # ---- Mirror MCE/RHACM images (direct path, skopeo) ----

        - name: Mirror MCE/RHACM images to disconnected registry
          ansible.builtin.command:
            cmd: >-
              skopeo copy --all --remove-signatures
              --authfile {{ pull_secret_path }}
              --dest-tls-verify=false
              docker://{{ item }}
              docker://{{ mirror_registry }}/{{ item | regex_replace('^[^/]+/', '') }}
          loop: "{{ mce_rhacm_images }}"
          loop_control:
            label: "{{ item | regex_replace('^.*/([^@:]+).*$', '\\1') }}"
          register: skopeo_mce
          retries: 3
          delay: 3
          until: skopeo_mce.rc == 0
          changed_when: true
          when: mce_rhacm_images | length > 0

        # ---- Create MCE/RHACM IDMS resources ----

        - name: Create multicluster-engine-mirror IDMS
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ kubeconfig }}"
            definition:
              apiVersion: config.openshift.io/v1
              kind: ImageDigestMirrorSet
              metadata:
                name: multicluster-engine-mirror
              spec:
                imageDigestMirrors:
                  - source: "{{ source_registry_rht }}/multicluster-engine"
                    mirrors:
                      - "{{ mirror_registry }}/multicluster-engine"
          when: mce_rhacm_images | select('match', '.*/multicluster-engine/.*') | list | length > 0

        - name: Create rhacm2-mirror IDMS
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ kubeconfig }}"
            definition:
              apiVersion: config.openshift.io/v1
              kind: ImageDigestMirrorSet
              metadata:
                name: rhacm2-mirror
              spec:
                imageDigestMirrors:
                  - source: "{{ source_registry_rht }}/rhacm2"
                    mirrors:
                      - "{{ mirror_registry }}/rhacm2"
          when: mce_rhacm_images | select('match', '.*/rhacm2/.*') | list | length > 0

        # ---- Summary ----

        - name: Display summary
          ansible.builtin.debug:
            msg: >-
              Mirrored {{ mce_rhacm_images | length }} MCE/RHACM images (skopeo, direct path).
              Mirrored operator catalog content via oc-mirror v2 ({{ operator_mirror_prefix }}/ prefix).
              Applied {{ oc_mirror_manifests.files | length }} generated IDMS/CatalogSource manifests.
              Created MCE/RHACM IDMS on hub {{ mirror_registry }}.

      always:

        - name: Clean up temporary pull secret file
          ansible.builtin.file:
            path: "{{ pull_secret_path }}"
            state: absent

        - name: Clean up ImageSetConfiguration file
          ansible.builtin.file:
            path: "{{ imageset_config_path }}"
            state: absent

        - name: Clean up oc-mirror workspace
          ansible.builtin.file:
            path: "{{ oc_mirror_workspace }}"
            state: absent
